name: V5 Dashboard Health Checks

on:
  push:
    branches:
      - feature/v5-dashboard-health
  pull_request:
    paths:
      - app.py
      - shadow_research.py
      - .github/workflows/dashboard-health-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py shadow_research.py
      - run: python shadow_research.py --self-test
