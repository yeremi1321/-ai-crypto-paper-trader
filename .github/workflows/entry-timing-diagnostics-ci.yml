name: Entry Timing Diagnostic Checks

on:
  push:
    branches: ["feature/entry-timing-diagnostics"]
  pull_request:
    paths:
      - "entry_timing_diagnostics.py"
      - ".github/workflows/entry-timing-diagnostics-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile entry_timing_diagnostics.py
      - run: python entry_timing_diagnostics.py --self-test
