name: Fast 5m shadow research

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-5m-shadow
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run 5m shadow research
        run: python fast_5m_shadow.py
      - name: Commit research history
        run: |
          git config user.name "crypto-paper-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add research_shadow.db
          git diff --cached --quiet && exit 0
          git commit -m "Record fast 5m shadow research"
          git pull --rebase origin main
          git push
