name: Memecoin fast snapshots

on:
  workflow_dispatch:
  # Schedule removed 2026-09-30: the Render bot is the source of truth. This copy sampled prices only every
  # 5-13 minutes (too sparse for exit research) and committed its database to the repo every few minutes.

permissions:
  contents: write

concurrency:
  group: memecoin-shadow
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Capture active memecoin price paths
        run: python memecoin_outcomes.py
      - name: Update memecoin paper positions
        run: python memecoin_paper.py
      - name: Predict new discoveries and learn from outcomes
        continue-on-error: true
        run: python memecoin_predictor.py
      - name: Commit snapshot history
        run: |
          git config user.name "memecoin-snapshot-collector"
          git config user.email "actions@users.noreply.github.com"
          git add memecoin_shadow.db
          git diff --cached --quiet && exit 0
          git commit -m "Record fast memecoin snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
