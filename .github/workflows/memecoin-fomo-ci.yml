name: Memecoin FOMO Paper Bot Checks
on:
  push:
    branches: ["fomo-paper-bot"]
  pull_request:
    paths:
      - "memecoin_fomo.py"
      - "test_memecoin_fomo.py"
      - "memecoin_fast_collector.py"
      - "memecoin_shadow.py"
      - "memecoin_discovery.py"
      - ".github/workflows/memecoin-fomo-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile memecoin_fomo.py memecoin_fast_collector.py
      - run: python -m pytest -q test_memecoin_fomo.py
