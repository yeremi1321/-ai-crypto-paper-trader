name: Memecoin Paper Dashboard Checks
on:
  push:
    branches: ["feature/meme-paper-dashboard"]
  pull_request:
    paths: ["app.py",".github/workflows/memecoin-paper-dashboard-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py
