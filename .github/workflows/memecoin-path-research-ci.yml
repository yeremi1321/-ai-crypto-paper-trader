name: Memecoin Path Research Checks

on:
  push:
    branches: [feature/memecoin-path-research]
  pull_request:
    paths:
      - memecoin_outcomes.py
      - memecoin_discovery.py
      - memecoin_research.py
      - .github/workflows/memecoin-path-research-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile memecoin_outcomes.py memecoin_discovery.py memecoin_research.py
      - run: python memecoin_discovery.py --self-test
      - run: python memecoin_research.py --self-test
