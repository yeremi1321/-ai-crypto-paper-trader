name: Memecoin Entry Exit Research Checks
on:
  push:
    branches: ["feature/memecoin-entry-exit-research"]
  pull_request:
    paths: ["memecoin_research.py"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile memecoin_research.py
      - run: python memecoin_research.py --self-test
