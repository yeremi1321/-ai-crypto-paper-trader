name: Memecoin Shadow Safety Checks

on:
  pull_request:
    paths:
      - "memecoin_shadow.py"
      - ".github/workflows/memecoin-shadow-ci.yml"
  push:
    branches:
      - feature/memecoin-shadow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile memecoin_shadow.py
      - name: Self test
        run: python memecoin_shadow.py --self-test
