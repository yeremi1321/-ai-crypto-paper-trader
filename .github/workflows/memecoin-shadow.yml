name: Memecoin shadow scan

on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"

permissions:
  contents: write

concurrency:
  group: memecoin-shadow
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Update prior meme outcomes
        run: python memecoin_outcomes.py
      - name: Update memecoin paper positions
        run: python memecoin_paper.py
      - name: Analyze accumulated meme outcomes
        run: python memecoin_research.py

      - name: Analyze pre-spike signatures
        run: python memecoin_pre_spike.py

      - name: Discover and evaluate Solana memecoins
        env:
          GOPLUS_TOKEN: ${{ secrets.GOPLUS_TOKEN }}
        run: python memecoin_discovery.py --limit 30
      - name: Commit shadow history
        run: |
          git config user.name "memecoin-shadow-scanner"
          git config user.email "actions@users.noreply.github.com"
          if [ -f memecoin_shadow.db ]; then git add memecoin_shadow.db; fi
          git diff --cached --quiet && exit 0
          git commit -m "Record memecoin shadow scan"
          git pull --rebase origin main
          git push origin HEAD:main
