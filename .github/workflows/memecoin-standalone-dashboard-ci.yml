name: Standalone Memecoin Dashboard Checks
on:
  push:
    branches: ["feature/standalone-meme-dashboard"]
  pull_request:
    paths: ["memecoin_dashboard.py",".github/workflows/memecoin-standalone-dashboard-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m py_compile memecoin_dashboard.py
