name: Perplexity Breakout Checks
on:
  pull_request:
    paths:
      - "perplexity_breakout.py"
      - "test_perplexity_breakout.py"
      - ".github/workflows/perplexity-breakout.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile perplexity_breakout.py test_perplexity_breakout.py
      - run: python -m unittest -v test_perplexity_breakout.py
