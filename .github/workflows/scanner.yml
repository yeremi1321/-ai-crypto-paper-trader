name: Automatic crypto research scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run paper research scan
        run: python scanner.py

      - name: Run shadow-only research
        run: python shadow_research.py

      - name: Commit scan history
        run: |
          git config user.name "crypto-paper-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add paper_trader_v4.db
          if [ -f research_shadow.db ]; then
            git add research_shadow.db
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Record automated paper scan"
          git pull --rebase origin main
          git push
