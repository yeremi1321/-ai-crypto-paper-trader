name: Shadow Research Safety Checks

on:
  push:
    branches:
      - fix/shadow-data-fallback
  pull_request:
    paths:
      - shadow_research.py
      - .github/workflows/shadow-research-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile shadow_research.py
      - run: python shadow_research.py --self-test
