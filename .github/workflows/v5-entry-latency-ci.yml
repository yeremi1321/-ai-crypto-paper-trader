name: V5 Entry Latency Checks

on:
  push:
    branches: [feature/v5-entry-latency]
  pull_request:
    paths:
      - app.py
      - .github/workflows/v5-entry-latency-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile app.py
