name: V5 Learning Progress Checks

on:
  push:
    branches:
      - feature/v5-continuous-progress
  pull_request:
    paths:
      - app.py
      - .github/workflows/v5-learning-progress-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py
